<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps CI/CD Web Application</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
    }
    main {
      text-align: center;
      background: #1e293b;
      padding: 3rem;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0,0,0,.3);
    }
    h1 { color: #38bdf8; }
    .status { color: #4ade80; font-weight: bold; }
  </style>
</head>
<body>
  <main>
    <h1>DevOps CI/CD Web Application</h1>
    <p>Automated deployment using GitHub Actions, SSH, Bash, Docker, and systemd.</p>
    <p class="status">Version 1.0 — Deployment Ready</p>
  </main>
</body>
</html>
